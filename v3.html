<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>地球保衛隊｜單元三：回收特務 MindAR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      touch-action: none;
      font-family: 'Noto Sans TC', "Microsoft JhengHei", "PingFang TC", sans-serif;
    }
    a-scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      touch-action: none;
    }
    @keyframes scanPulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.03); opacity: 1; }
    }
    .scanner-frame {
      animation: scanPulse 2s infinite ease-in-out;
    }
    @keyframes swipeHint {
      0% { transform: translateX(-14px); opacity: 0.35; }
      50% { transform: translateX(14px); opacity: 1; }
      100% { transform: translateX(-14px); opacity: 0.35; }
    }
    .animate-swipe {
      animation: swipeHint 1.4s infinite ease-in-out;
    }
    @keyframes bounceTap {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-6px) scale(1.1); }
    }
    .animate-tap {
      animation: bounceTap 1.1s infinite ease-in-out;
    }
    @keyframes shakePhone {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-18deg); }
      75% { transform: rotate(18deg); }
    }
    .animate-shake {
      animation: shakePhone 0.5s infinite ease-in-out;
    }
  </style>
</head>
<body>

  <!-- 1. 頂部狀態與進度導覽 -->
  <header class="fixed top-0 left-0 right-0 z-20 p-2 sm:p-3 flex flex-col gap-1.5 pointer-events-none">
    <div class="flex items-center justify-between bg-slate-900/85 backdrop-blur-md border border-white/15 rounded-xl px-3 py-1.5 shadow-lg pointer-events-auto">
      <div class="flex items-center gap-2 min-w-0">
        <span class="text-lg shrink-0">🛡️</span>
        <div class="truncate">
          <h1 class="text-xs sm:text-sm font-bold text-emerald-400 truncate">地球保衛隊｜回收特務 AR</h1>
          <p id="camera-status" class="text-[10px] text-slate-300 truncate">正在載入 3D 模型與圖卡引擎...</p>
        </div>
      </div>

      <div class="flex items-center gap-1.5 shrink-0">
        <span id="detected-badge" class="px-2.5 py-1 rounded-lg text-[11px] font-extrabold bg-slate-800 text-slate-300 border border-slate-700">
          等待掃描圖卡
        </span>
        <button id="btn-rescan" onclick="resetToScanMode()"
          class="hidden px-2.5 py-1 rounded-lg text-[11px] font-bold bg-slate-700 hover:bg-slate-600 text-white border border-slate-500 transition">
          🔄 重掃
        </button>
      </div>
    </div>

    <!-- iframe 內嵌提醒條 -->
    <div id="iframe-warning-bar" class="hidden pointer-events-auto bg-rose-950/95 border border-rose-400 rounded-xl px-3 py-1.5 flex items-center justify-between gap-2 shadow-lg">
      <span class="text-[11px] text-rose-100 leading-tight">⚠️ 內嵌網頁限制相機與感測器，請點右側開啟獨立分頁：</span>
      <a id="btn-open-standalone" href="#" target="_blank" rel="noopener noreferrer"
        class="bg-rose-500 hover:bg-rose-400 text-white font-bold text-[11px] px-2.5 py-1 rounded-lg shrink-0">
        ↗️ 開啟真實相機
      </a>
    </div>

    <!-- 步驟進度條（偵測到圖卡後顯示） -->
    <div id="step-pills-bar" class="hidden grid grid-cols-4 gap-1 bg-slate-900/80 backdrop-blur-md p-1 rounded-xl border border-white/10 shadow">
      <div id="step-pill-1" class="flex items-center justify-center py-1 px-1 rounded-lg bg-amber-400 text-slate-950 font-bold text-[11px] transition"></div>
      <div id="step-pill-2" class="flex items-center justify-center py-1 px-1 rounded-lg bg-slate-800/80 text-slate-400 font-bold text-[11px] transition"></div>
      <div id="step-pill-3" class="flex items-center justify-center py-1 px-1 rounded-lg bg-slate-800/80 text-slate-400 font-bold text-[11px] transition"></div>
      <div id="step-pill-4" class="flex items-center justify-center py-1 px-1 rounded-lg bg-slate-800/80 text-slate-400 font-bold text-[11px] transition"></div>
    </div>

    <!-- 緊湊型任務引導條（偵測到圖卡後顯示） -->
    <div id="action-guide-banner" class="hidden w-full pointer-events-none">
      <div class="bg-slate-900/85 backdrop-blur-md border border-amber-400/80 rounded-xl px-3 py-2 shadow-lg flex items-center gap-2.5">
        <div id="guide-icon" class="text-2xl animate-swipe shrink-0">👉</div>
        <div class="flex-1 text-left min-w-0">
          <div id="guide-title" class="text-xs sm:text-sm font-extrabold text-amber-300 truncate"></div>
          <div id="guide-desc" class="text-[11px] sm:text-xs text-slate-200 leading-snug"></div>
        </div>
      </div>
      <!-- 沖洗進度條 -->
      <div id="rinse-progress-wrap" class="hidden mt-1.5 bg-slate-900/90 rounded-full p-0.5 border border-sky-400/60">
        <div class="w-full bg-slate-800 rounded-full h-2.5 overflow-hidden">
          <div id="rinse-progress-bar" class="bg-gradient-to-r from-sky-400 to-cyan-300 h-full transition-all duration-150" style="width: 0%"></div>
        </div>
      </div>
    </div>
  </header>

  <!-- 2. 掃描準心框（開啟相機後、尚未偵測到圖卡時顯示） -->
  <div id="scanning-reticle" class="hidden fixed inset-0 z-10 pointer-events-none flex flex-col items-center justify-center">
    <div class="scanner-frame w-56 h-56 sm:w-64 sm:h-64 border-4 border-dashed border-emerald-400/85 rounded-3xl flex flex-col items-center justify-end p-4 bg-emerald-500/5">
      <span class="bg-slate-900/85 text-emerald-200 text-xs font-bold px-3 py-1.5 rounded-full border border-emerald-400/40 text-center">
        🔍 請對準「飲料杯」或「便當盒」照片
      </span>
    </div>
  </div>

  <!-- 3. 啟動前引導遮罩 -->
  <div id="start-overlay" class="fixed inset-0 z-30 flex flex-col items-center justify-center bg-slate-950/90 backdrop-blur-sm p-6 text-center">
    <div class="scanner-frame w-56 h-56 sm:w-64 sm:h-64 border-4 border-dashed border-emerald-400 rounded-3xl flex flex-col items-center justify-center p-4 bg-emerald-500/10 mb-5">
      <span class="text-5xl mb-2">📷</span>
      <p class="text-base font-bold text-white">對準桌上的垃圾照片圖卡</p>
      <p class="text-xs text-emerald-200 mt-1.5 leading-relaxed">
        開啟後不會直接顯示模型，<br>掃到「飲料杯」或「便當盒」才會出現互動任務！
      </p>
    </div>

    <button id="btn-start-ar" disabled onclick="startMindAR()"
      class="bg-slate-700 text-slate-300 font-extrabold text-base px-7 py-3 rounded-full shadow-2xl transition">
      ⏳ 3D 模型與圖卡資料載入中...
    </button>
    <p class="text-[11px] text-slate-400 mt-2.5 max-w-xs leading-relaxed">
      請允許瀏覽器使用「相機」與「動作感測器」權限
    </p>
  </div>

  <!-- 4. 回收小精靈溫和鷹架回饋氣泡 -->
  <div id="elf-feedback" class="hidden fixed bottom-36 left-1/2 -translate-x-1/2 z-30 w-[92%] max-w-md transition-all">
    <div class="bg-amber-950/95 border-2 border-amber-400 rounded-2xl p-3 shadow-2xl flex items-start gap-2.5">
      <span class="text-2xl">🧚</span>
      <div class="flex-1 text-left">
        <p class="text-[11px] font-bold text-amber-300">回收小精靈提醒你：</p>
        <p id="elf-message" class="text-xs sm:text-sm text-white font-medium mt-0.5 leading-snug"></p>
      </div>
      <button onclick="hideElfFeedback()" class="text-amber-300 hover:text-white text-sm font-bold px-1.5">✕</button>
    </div>
  </div>

  <!-- 5. 底部三大分類回收桶（偵測到圖卡後才顯示，供拖曳投入） -->
  <footer id="bins-container" class="hidden fixed bottom-0 left-0 right-0 z-20 p-3 sm:p-4 bg-gradient-to-t from-slate-950/95 via-slate-950/80 to-transparent pointer-events-none">
    <p id="bins-hint" class="text-center text-xs text-slate-200 mb-2 font-bold drop-shadow">
      處理步驟完成後，用手指按住容器「拖曳」進下方分類桶：
    </p>
    <div class="grid grid-cols-3 gap-2.5 max-w-xl mx-auto">
      <div id="bin-general" data-bin="general"
        class="bin-zone bg-slate-800/90 border-2 border-slate-500 rounded-2xl p-2.5 flex flex-col items-center justify-center transition transform">
        <span class="text-2xl sm:text-3xl">🗑️</span>
        <span class="text-xs sm:text-sm font-bold text-slate-200 mt-1">一般垃圾</span>
        <span class="text-[10px] text-slate-400">封膜 / 吸管</span>
      </div>

      <div id="bin-recycle" data-bin="recycle"
        class="bin-zone bg-sky-950/90 border-2 border-sky-400 rounded-2xl p-2.5 flex flex-col items-center justify-center transition transform">
        <span class="text-2xl sm:text-3xl">♻️</span>
        <span class="text-xs sm:text-sm font-bold text-sky-300 mt-1">資源回收</span>
        <span class="text-[10px] text-sky-200/80">乾淨杯 / 紙餐盒</span>
      </div>

      <div id="bin-food" data-bin="food"
        class="bin-zone bg-amber-950/90 border-2 border-amber-500 rounded-2xl p-2.5 flex flex-col items-center justify-center transition transform">
        <span class="text-2xl sm:text-3xl">🍲</span>
        <span class="text-xs sm:text-sm font-bold text-amber-300 mt-1">廚餘回收</span>
        <span class="text-[10px] text-amber-200/80">剩飯菜渣</span>
      </div>
    </div>
  </footer>

  <!-- 6. 通關徽章視窗 -->
  <div id="badge-modal" class="hidden fixed inset-0 z-40 flex items-center justify-center bg-slate-950/85 backdrop-blur-md p-5">
    <div class="bg-slate-900 border-2 border-emerald-400 rounded-3xl max-w-sm w-full p-6 text-center shadow-2xl">
      <div class="w-24 h-24 mx-auto bg-gradient-to-tr from-emerald-400 to-teal-300 rounded-full flex items-center justify-center text-5xl shadow-lg mb-4">
        🏅
      </div>
      <h2 class="text-xl font-extrabold text-emerald-300">任務成功！解鎖「回收特務」徽章</h2>
      <p id="badge-summary" class="text-sm text-slate-300 mt-2 leading-relaxed"></p>
      <div class="mt-5 flex flex-col gap-2">
        <button onclick="scanAnotherCard()"
          class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold py-3 rounded-xl transition">
          📷 繼續掃描下一張圖卡
        </button>
        <button onclick="resetCurrentTask()"
          class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2.5 rounded-xl text-sm transition">
          🔄 重新練習本關
        </button>
      </div>
    </div>
  </div>

  <!-- 7. MindAR + A-Frame AR 場景 -->
  <a-scene
    id="ar-scene"
    mindar-image="imageTargetSrc: ./assets/targets_recycle.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no;"
    renderer="colorManagement: true; toneMapping: ACESFilmic; exposure: 0.68; alpha: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    loading-screen="enabled: false"
  >
    <a-camera id="ar-camera" position="0 0 0" look-controls="enabled: false">
      <!-- 拖曳中或短暫偏離鏡頭時的相機空間舞台（確保手指拖進分類桶或搖晃手機時模型不中斷） -->
      <a-entity id="camera-stage" position="0 0 -1.25"></a-entity>
    </a-camera>

    <!-- 柔和且具立體明暗對比的光源（避免過曝泛白） -->
    <a-entity light="type: ambient; intensity: 0.35; color: #ffffff"></a-entity>
    <a-entity light="type: directional; intensity: 0.78; color: #fff8ed" position="1.4 2.5 1.8"></a-entity>
    <a-entity light="type: directional; intensity: 0.22; color: #cbd5e1" position="-1.8 0.6 1.0"></a-entity>

    <!-- Target 0: 飲料杯照片 (正向直立：rotation 0 0 0) -->
    <a-entity id="target-drink" mindar-image-target="targetIndex: 0">
      <a-entity id="anchor-drink" position="0 -0.22 0.05">
        <a-entity
          id="model-drink"
          gltf-model="url(./assets/drink.glb)"
          position="0 0 0"
          rotation="0 0 0"
          scale="2.5 2.5 2.5"
        ></a-entity>
      </a-entity>
    </a-entity>

    <!-- Target 1: 便當盒照片 (正向朝前、微傾 22° 以便看清盒內菜色) -->
    <a-entity id="target-bento" mindar-image-target="targetIndex: 1">
      <a-entity id="anchor-bento" position="0 -0.15 0.05">
        <a-entity
          id="model-bento"
          gltf-model="url(./assets/bento.glb)"
          position="0 0 0"
          rotation="22 0 0"
          scale="2.1 2.1 2.1"
        ></a-entity>
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    // =========================================================================
    // 《地球保衛隊》單元三 MindAR 辨識 + v1 觸控/搖晃互動
    // =========================================================================
    const sceneEl = document.getElementById('ar-scene');
    const cameraStageEl = document.getElementById('camera-stage');
    const targetDrinkEl = document.getElementById('target-drink');
    const targetBentoEl = document.getElementById('target-bento');
    const anchorDrinkEl = document.getElementById('anchor-drink');
    const anchorBentoEl = document.getElementById('anchor-bento');
    const modelDrinkEl = document.getElementById('model-drink');
    const modelBentoEl = document.getElementById('model-bento');

    const startBtn = document.getElementById('btn-start-ar');
    const cameraStatusEl = document.getElementById('camera-status');
    const detectedBadgeEl = document.getElementById('detected-badge');
    const rescanBtn = document.getElementById('btn-rescan');
    const reticleEl = document.getElementById('scanning-reticle');
    const pillsBarEl = document.getElementById('step-pills-bar');
    const guideBannerEl = document.getElementById('action-guide-banner');
    const binsContainerEl = document.getElementById('bins-container');

    let sceneLoaded = Boolean(sceneEl.hasLoaded);
    let drinkLoaded = false;
    let bentoLoaded = false;
    let arStarted = false;
    let arStarting = false;

    // 任務狀態
    let activeTarget = null; // null | 'drink' | 'bento'
    let isTargetVisible = false;
    let currentStep = 1;
    let rinseAmount = 0;

    // 互動手勢狀態
    let isPointerDown = false;
    let dragStartPos = { x: 0, y: 0 };
    let lastPointerPos = { x: 0, y: 0 };
    let lastShakeDir = 0;
    let isDraggingModel = false;
    let isDraggingFood = false;

    // GLB 子節點參照與初始狀態
    const glbParts = {
      drink: { film: null, straw: null, filmInitPos: null, strawInitPos: null },
      bento: { food: null, foodParent: null, foodInitPos: null, foodInitScale: null }
    };

    // iframe 偵測
    window.addEventListener('DOMContentLoaded', () => {
      if (window.self !== window.top) {
        const warnBar = document.getElementById('iframe-warning-bar');
        const linkBtn = document.getElementById('btn-open-standalone');
        if (warnBar && linkBtn) {
          linkBtn.href = window.location.href;
          warnBar.classList.remove('hidden');
        }
      }
    });

    function checkAllReady() {
      if (arStarted || arStarting) return;
      if (sceneLoaded && drinkLoaded && bentoLoaded) {
        startBtn.disabled = false;
        startBtn.className = 'bg-gradient-to-r from-emerald-400 to-teal-500 hover:from-emerald-300 hover:to-teal-400 text-slate-950 font-extrabold text-base px-7 py-3 rounded-full shadow-2xl active:scale-95 transition';
        startBtn.textContent = '🚀 開啟鏡頭並啟動特務掃描';
        cameraStatusEl.textContent = '模型與圖卡資料已就緒，請點擊啟動掃描';
      }
    }

    // 調整材質避免強光過曝，保留清晰的立體感與色塊
    function tuneMaterials(mesh) {
      mesh.traverse((obj) => {
        if (!obj.isMesh || !obj.material) return;
        const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
        mats.forEach((mat) => {
          mat.metalness = 0.0;
          mat.roughness = Math.max(mat.roughness ?? 0.55, 0.52);
          mat.needsUpdate = true;
        });
      });
    }

    sceneEl.addEventListener('loaded', () => {
      sceneLoaded = true;
      checkAllReady();
    });

    modelDrinkEl.addEventListener('model-loaded', () => {
      const mesh = modelDrinkEl.getObject3D('mesh');
      if (mesh) {
        tuneMaterials(mesh);
        glbParts.drink.film = mesh.getObjectByName('Drink_Film');
        glbParts.drink.straw = mesh.getObjectByName('Drink_Straw');
        if (glbParts.drink.film) glbParts.drink.filmInitPos = glbParts.drink.film.position.clone();
        if (glbParts.drink.straw) glbParts.drink.strawInitPos = glbParts.drink.straw.position.clone();
      }
      drinkLoaded = true;
      checkAllReady();
    });

    modelBentoEl.addEventListener('model-loaded', () => {
      const mesh = modelBentoEl.getObject3D('mesh');
      if (mesh) {
        tuneMaterials(mesh);
        glbParts.bento.food = mesh.getObjectByName('Bento_Food');
        if (glbParts.bento.food) {
          glbParts.bento.foodParent = glbParts.bento.food.parent;
          glbParts.bento.foodInitPos = glbParts.bento.food.position.clone();
          glbParts.bento.foodInitScale = glbParts.bento.food.scale.clone();
        }
      }
      bentoLoaded = true;
      checkAllReady();
    });

    // MindAR 啟動完成
    sceneEl.addEventListener('arReady', () => {
      arStarting = false;
      arStarted = true;
      document.getElementById('start-overlay').classList.add('hidden');
      reticleEl.classList.remove('hidden');
      cameraStatusEl.textContent = '🟢 AR 鏡頭掃描中（請對準圖卡）';
    });

    sceneEl.addEventListener('arError', () => {
      arStarting = false;
      startBtn.disabled = false;
      startBtn.textContent = '🔄 重新嘗試啟動相機';
      cameraStatusEl.textContent = '❌ 無法啟動 AR 相機（請確認 HTTPS 與相機權限）';
    });

    async function startMindAR() {
      if (arStarted || arStarting || !sceneLoaded || !drinkLoaded || !bentoLoaded) return;

      if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
        cameraStatusEl.textContent = '⚠️ 需要 HTTPS 網址與支援相機的瀏覽器';
        return;
      }

      // 申請手機搖晃加速度感測權限 (iOS 13+)
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        try {
          await DeviceMotionEvent.requestPermission();
        } catch (e) {}
      }
      window.addEventListener('devicemotion', handleDeviceMotion);

      arStarting = true;
      startBtn.disabled = true;
      startBtn.textContent = '⏳ 正在開啟攝影機...';
      cameraStatusEl.textContent = '請允許瀏覽器使用相機與感測器權限...';

      try {
        await sceneEl.systems['mindar-image-system'].start();
      } catch (err) {
        arStarting = false;
        startBtn.disabled = false;
        startBtn.textContent = '🔄 重新嘗試啟動相機';
        const errName = err?.name || '';
        if (errName === 'NotAllowedError') {
          cameraStatusEl.textContent = '❌ 相機權限被拒絕，請允許相機後重試';
        } else if (errName === 'NotReadableError') {
          cameraStatusEl.textContent = '❌ 攝影機可能正被其他視窗/程式佔用中';
        } else {
          cameraStatusEl.textContent = `❌ 相機啟動失敗 (${errName || '未知錯誤'})`;
        }
      }
    }

    // =========================================================================
    // 圖卡偵測與顯示控制（未掃到前完全不顯示模型與介面）
    // =========================================================================
    targetDrinkEl.addEventListener('targetFound', () => onTargetFound('drink'));
    targetBentoEl.addEventListener('targetFound', () => onTargetFound('bento'));

    targetDrinkEl.addEventListener('targetLost', () => {
      if (activeTarget === 'drink') onTargetLost('drink');
    });
    targetBentoEl.addEventListener('targetLost', () => {
      if (activeTarget === 'bento') onTargetLost('bento');
    });

    function onTargetFound(type) {
      isTargetVisible = true;

      // 若目前尚未鎖定任務，或切換掃到另一張圖卡且尚未開始互動，啟動該任務
      if (activeTarget === null) {
        activeTarget = type;
        resetStepState(false);
        showTaskUI(type);
      }

      if (activeTarget === type) {
        // 將模型掛回圖卡錨點上（若未處於拖曳中）
        if (!isDraggingModel) {
          attachModelToPhoto(type);
        }
        cameraStatusEl.textContent = type === 'drink'
          ? '🟢 已鎖定飲料杯圖卡，請直接在畫面上動手操作'
          : '🟢 已鎖定便當盒圖卡，請直接在畫面上動手操作';
      }
    }

    function onTargetLost(type) {
      isTargetVisible = false;
      // 互動進行中若因搖晃手機或向下拖曳導致圖卡暫時離開鏡頭，將模型改掛到相機前方舞台，避免互動中斷！
      if (activeTarget === type && !isDraggingModel) {
        attachModelToCameraStage(type, 0, -0.1);
        cameraStatusEl.textContent = '🟡 暫離圖卡中（可繼續操作，或對準圖卡追蹤）';
      }
    }

    function attachModelToPhoto(type) {
      const modelEl = type === 'drink' ? modelDrinkEl : modelBentoEl;
      const anchorEl = type === 'drink' ? anchorDrinkEl : anchorBentoEl;
      if (modelEl.object3D && anchorEl.object3D) {
        anchorEl.object3D.add(modelEl.object3D);
        modelEl.object3D.position.set(0, 0, 0);
        modelEl.object3D.rotation.set(type === 'drink' ? 0 : (22 * Math.PI) / 180, 0, 0);
      }
    }

    function attachModelToCameraStage(type, xOffset = 0, yOffset = -0.1) {
      const modelEl = type === 'drink' ? modelDrinkEl : modelBentoEl;
      if (modelEl.object3D && cameraStageEl.object3D) {
        cameraStageEl.object3D.add(modelEl.object3D);
        modelEl.object3D.position.set(xOffset, yOffset, 0);
        modelEl.object3D.rotation.set(type === 'drink' ? 0 : (22 * Math.PI) / 180, 0, 0);
      }
    }

    function showTaskUI(type) {
      reticleEl.classList.add('hidden');
      pillsBarEl.classList.remove('hidden');
      guideBannerEl.classList.remove('hidden');
      binsContainerEl.classList.remove('hidden');
      rescanBtn.classList.remove('hidden');

      detectedBadgeEl.textContent = type === 'drink' ? '🧋 飲料杯任務' : '🍱 便當盒任務';
      detectedBadgeEl.className = 'px-2.5 py-1 rounded-lg text-[11px] font-extrabold bg-emerald-500 text-slate-950';
      updateStepUI();
    }

    function resetToScanMode() {
      // 復原兩個模型的視覺零件，並回到純掃描等待畫面
      restoreAllGLBParts();
      if (activeTarget) {
        attachModelToPhoto(activeTarget);
      }
      activeTarget = null;
      isTargetVisible = false;
      isDraggingModel = false;
      isDraggingFood = false;

      document.getElementById('badge-modal').classList.add('hidden');
      pillsBarEl.classList.add('hidden');
      guideBannerEl.classList.add('hidden');
      binsContainerEl.classList.add('hidden');
      rescanBtn.classList.add('hidden');
      hideElfFeedback();
      reticleEl.classList.remove('hidden');

      detectedBadgeEl.textContent = '等待掃描圖卡';
      detectedBadgeEl.className = 'px-2.5 py-1 rounded-lg text-[11px] font-extrabold bg-slate-800 text-slate-300 border border-slate-700';
      cameraStatusEl.textContent = '🟢 AR 鏡頭掃描中（請對準圖卡）';
    }

    // =========================================================================
    // 步驟狀態與 UI 更新 (v1 互動形式)
    // =========================================================================
    function getMaxStep() {
      return activeTarget === 'drink' ? 4 : 3;
    }

    function resetStepState(restoreParts = true) {
      currentStep = 1;
      rinseAmount = 0;
      isDraggingModel = false;
      isDraggingFood = false;
      lastShakeDir = 0;
      document.getElementById('rinse-progress-bar').style.width = '0%';
      document.getElementById('rinse-progress-wrap').classList.add('hidden');
      hideElfFeedback();
      if (restoreParts) restoreAllGLBParts();
      if (activeTarget) updateStepUI();
    }

    function restoreAllGLBParts() {
      if (glbParts.drink.film) {
        glbParts.drink.film.visible = true;
        glbParts.drink.film.rotation.set(0, 0, 0);
        if (glbParts.drink.filmInitPos) glbParts.drink.film.position.copy(glbParts.drink.filmInitPos);
      }
      if (glbParts.drink.straw) {
        glbParts.drink.straw.visible = true;
        glbParts.drink.straw.rotation.set(0, 0, 0);
        if (glbParts.drink.strawInitPos) glbParts.drink.straw.position.copy(glbParts.drink.strawInitPos);
      }
      if (glbParts.bento.food && glbParts.bento.foodParent) {
        glbParts.bento.foodParent.add(glbParts.bento.food);
        glbParts.bento.food.visible = true;
        glbParts.bento.food.rotation.set(0, 0, 0);
        if (glbParts.bento.foodInitPos) glbParts.bento.food.position.copy(glbParts.bento.foodInitPos);
        if (glbParts.bento.foodInitScale) glbParts.bento.food.scale.copy(glbParts.bento.foodInitScale);
      }
    }

    function updateStepUI() {
      if (!activeTarget) return;
      const isDrink = activeTarget === 'drink';
      const labels = isDrink
        ? ['1. 撕除封膜', '2. 拔出吸管', '3. 左右搖洗', '4. 正確分類']
        : ['1. 拖曳廚餘', '2. 左右搖洗', '3. 正確分類'];

      pillsBarEl.className = isDrink
        ? 'grid grid-cols-4 gap-1 bg-slate-900/80 backdrop-blur-md p-1 rounded-xl border border-white/10 shadow'
        : 'grid grid-cols-3 gap-1 bg-slate-900/80 backdrop-blur-md p-1 rounded-xl border border-white/10 shadow';

      for (let i = 1; i <= 4; i++) {
        const pill = document.getElementById(`step-pill-${i}`);
        if (i > labels.length) {
          pill.classList.add('hidden');
          continue;
        }
        pill.classList.remove('hidden');
        pill.textContent = labels[i - 1];
        if (i < currentStep) {
          pill.className = 'flex items-center justify-center py-1 px-1 rounded-lg bg-emerald-500/90 text-slate-950 font-bold text-[11px] transition';
        } else if (i === currentStep) {
          pill.className = 'flex items-center justify-center py-1 px-1 rounded-lg bg-amber-400 text-slate-950 font-extrabold text-[11px] shadow transition';
        } else {
          pill.className = 'flex items-center justify-center py-1 px-1 rounded-lg bg-slate-800/80 text-slate-400 font-bold text-[11px] transition';
        }
      }

      const iconEl = document.getElementById('guide-icon');
      const titleEl = document.getElementById('guide-title');
      const descEl = document.getElementById('guide-desc');
      const rinseWrap = document.getElementById('rinse-progress-wrap');
      rinseWrap.classList.add('hidden');

      if (isDrink) {
        if (currentStep === 1) {
          iconEl.textContent = '👉';
          iconEl.className = 'text-2xl animate-swipe shrink-0';
          titleEl.textContent = '任務 1：手動滑動撕開塑膠封膜';
          descEl.textContent = '用手指在畫面上的杯口封膜「左右滑動」，把綠色封膜撕掉！';
        } else if (currentStep === 2) {
          iconEl.textContent = '👆';
          iconEl.className = 'text-2xl animate-tap shrink-0';
          titleEl.textContent = '任務 2：手動點擊拔出吸管';
          descEl.textContent = '直接「點擊」畫面上的綠色吸管，將它抽出來！';
        } else if (currentStep === 3) {
          iconEl.textContent = '📳';
          iconEl.className = 'text-2xl animate-shake shrink-0';
          titleEl.textContent = '任務 3：左右搖晃手機模擬沖洗';
          descEl.textContent = '請拿著手機「左右搖晃」（或在杯子上快速左右來回滑動），洗淨殘留！';
          rinseWrap.classList.remove('hidden');
        } else if (currentStep === 4) {
          iconEl.textContent = '♻️';
          iconEl.className = 'text-2xl animate-bounce shrink-0';
          titleEl.textContent = '任務 4：手動拖曳飲料杯進分類桶';
          descEl.textContent = '按住洗乾淨的飲料杯，往下「拖曳」進下方正確的回收分類桶！';
        }
      } else {
        if (currentStep === 1) {
          iconEl.textContent = '🍲';
          iconEl.className = 'text-2xl animate-bounce shrink-0';
          titleEl.textContent = '任務 1：將飯菜廚餘拖曳至廚餘桶';
          descEl.textContent = '按住便當盒裡的飯菜，往下「拖曳」進右下角的「🍲 廚餘回收」桶！';
        } else if (currentStep === 2) {
          iconEl.textContent = '📳';
          iconEl.className = 'text-2xl animate-shake shrink-0';
          titleEl.textContent = '任務 2：左右搖晃手機模擬沖洗油漬';
          descEl.textContent = '請拿著手機「左右搖晃」（或在便當盒上快速左右來回滑動），沖淨油漬！';
          rinseWrap.classList.remove('hidden');
        } else if (currentStep === 3) {
          iconEl.textContent = '♻️';
          iconEl.className = 'text-2xl animate-bounce shrink-0';
          titleEl.textContent = '任務 3：手動拖曳便當盒進分類桶';
          descEl.textContent = '按住洗乾淨的紙便當盒，往下「拖曳」進下方正確的回收分類桶！';
        }
      }
    }

    // =========================================================================
    // 手勢觸控與 v1 互動判定
    // =========================================================================
    window.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);

    function onPointerDown(e) {
      if (!activeTarget || e.target.closest('button, a')) return;
      if (!document.getElementById('badge-modal').classList.contains('hidden')) return;

      isPointerDown = true;
      dragStartPos = { x: e.clientX, y: e.clientY };
      lastPointerPos = { x: e.clientX, y: e.clientY };

      if (activeTarget === 'drink') {
        if (currentStep === 2 && glbParts.drink.straw) {
          isPointerDown = false;
          animateRemovePart(glbParts.drink.straw, { x: 0.14, y: 0.25, z: 0 }, () => {
            currentStep = 3;
            updateStepUI();
          });
        } else if (currentStep === 4) {
          isDraggingModel = true;
          moveDraggedModelToPointer(e.clientX, e.clientY);
        }
      } else if (activeTarget === 'bento') {
        if (currentStep === 1 && glbParts.bento.food) {
          isDraggingFood = true;
          moveDraggedFoodToPointer(e.clientX, e.clientY);
        } else if (currentStep === 3) {
          isDraggingModel = true;
          moveDraggedModelToPointer(e.clientX, e.clientY);
        }
      }
    }

    function onPointerMove(e) {
      if (!isPointerDown || !activeTarget) return;
      const dx = e.clientX - dragStartPos.x;
      const stepDx = e.clientX - lastPointerPos.x;
      lastPointerPos = { x: e.clientX, y: e.clientY };

      // 飲料杯步驟 1：左右滑動撕除封膜
      if (activeTarget === 'drink' && currentStep === 1 && Math.abs(dx) > 40) {
        isPointerDown = false;
        if (glbParts.drink.film) {
          animateRemovePart(glbParts.drink.film, { x: dx > 0 ? 0.26 : -0.26, y: 0.12, z: 0 }, () => {
            currentStep = 2;
            updateStepUI();
          });
        }
        return;
      }

      // 便當盒步驟 1：拖曳飯菜廚餘到下方廚餘桶
      if (activeTarget === 'bento' && currentStep === 1 && isDraggingFood) {
        moveDraggedFoodToPointer(e.clientX, e.clientY);
        highlightHoveredBin(e.clientX, e.clientY);
        return;
      }

      // 沖洗步驟（飲料杯步驟 3 / 便當盒步驟 2）：快速左右來回滑動模擬清洗
      const isRinseStep = (activeTarget === 'drink' && currentStep === 3) || (activeTarget === 'bento' && currentStep === 2);
      if (isRinseStep && Math.abs(stepDx) > 12) {
        const currentDir = stepDx > 0 ? 1 : -1;
        if (currentDir !== lastShakeDir) {
          lastShakeDir = currentDir;
          triggerRinseProgress(14);
        }
      }

      // 最終分類步驟：拖曳整個乾淨容器到下方分類桶
      if (isDraggingModel) {
        moveDraggedModelToPointer(e.clientX, e.clientY);
        highlightHoveredBin(e.clientX, e.clientY);
      }
    }

    function onPointerUp(e) {
      if (!isPointerDown && !isDraggingModel && !isDraggingFood) return;

      // 便當盒步驟 1：檢查廚餘是否丟進「廚餘回收」桶
      if (activeTarget === 'bento' && currentStep === 1 && isDraggingFood) {
        const droppedBin = getDroppedBin(e.clientX, e.clientY);
        clearBinHighlights();
        if (droppedBin === 'food') {
          if (glbParts.bento.food) glbParts.bento.food.visible = false;
          hideElfFeedback();
          currentStep = 2;
          updateStepUI();
        } else {
          restoreDraggedFoodToBox();
          if (droppedBin === 'recycle') {
            showElfFeedback('不能把剩飯跟菜渣直接丟進資源回收桶喔！請把廚餘拖曳到右下角的「🍲 廚餘回收」桶！');
          } else if (droppedBin === 'general') {
            showElfFeedback('吃剩的飯菜可以回收再利用，請拖曳到右下角的「🍲 廚餘回收」桶，不要丟一般垃圾喔！');
          } else {
            showElfFeedback('請按住便當盒裡的飯菜，一路往下拖曳進右下角的「🍲 廚餘回收」桶！');
          }
        }
        isPointerDown = false;
        isDraggingFood = false;
        return;
      }

      // 若前處理步驟尚未完成就直接把模型往下拖，跳出 3D 精靈提醒
      const maxStep = getMaxStep();
      if (currentStep < maxStep && isPointerDown) {
        const dy = e.clientY - dragStartPos.y;
        if (dy > 90) {
          triggerMissingStepFeedback();
        }
      }

      // 最終分類步驟：判定丟入哪個桶子
      if (currentStep === maxStep && isDraggingModel) {
        const handled = checkBinDrop(e.clientX, e.clientY);
        clearBinHighlights();
        if (isTargetVisible) {
          attachModelToPhoto(activeTarget);
        } else {
          attachModelToCameraStage(activeTarget, 0, -0.1);
        }
        if (!handled) {
          showElfFeedback('請按住洗乾淨的容器，往下拖曳到下方的分類桶內放開喔！');
        }
      }

      isPointerDown = false;
      isDraggingModel = false;
      isDraggingFood = false;
    }

    function screenToStageCoords(clientX, clientY) {
      const cam = sceneEl.camera;
      const dist = 1.25;
      const vFov = ((cam && cam.fov) ? cam.fov : 50) * Math.PI / 180;
      const visHeight = 2 * Math.tan(vFov / 2) * dist;
      const aspect = (cam && cam.aspect) ? cam.aspect : (window.innerWidth / window.innerHeight);
      const visWidth = visHeight * aspect;
      return {
        x: (clientX / window.innerWidth - 0.5) * visWidth,
        y: -(clientY / window.innerHeight - 0.5) * visHeight
      };
    }

    // 將整個 3D 容器移到相機前景並跟隨手指位置
    function moveDraggedModelToPointer(clientX, clientY) {
      const { x, y } = screenToStageCoords(clientX, clientY);
      attachModelToCameraStage(activeTarget, x, y);
    }

    // 將便當盒裡的飯菜（Bento_Food）單獨抽出跟隨手指拖曳
    function moveDraggedFoodToPointer(clientX, clientY) {
      const food = glbParts.bento.food;
      if (!food || !cameraStageEl.object3D) return;
      cameraStageEl.object3D.add(food);
      food.scale.set(2.1, 2.1, 2.1);
      food.rotation.set((22 * Math.PI) / 180, 0, 0);
      const { x, y } = screenToStageCoords(clientX, clientY);
      food.position.set(x, y, 0.05);
    }

    function restoreDraggedFoodToBox() {
      const food = glbParts.bento.food;
      const parent = glbParts.bento.foodParent;
      if (!food || !parent) return;
      parent.add(food);
      food.rotation.set(0, 0, 0);
      if (glbParts.bento.foodInitPos) food.position.copy(glbParts.bento.foodInitPos);
      if (glbParts.bento.foodInitScale) food.scale.copy(glbParts.bento.foodInitScale);
    }

    function getDroppedBin(x, y) {
      let droppedBin = null;
      document.querySelectorAll('.bin-zone').forEach((bin) => {
        const rect = bin.getBoundingClientRect();
        if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
          droppedBin = bin.dataset.bin;
        }
      });
      return droppedBin;
    }

    function highlightHoveredBin(x, y) {
      document.querySelectorAll('.bin-zone').forEach((bin) => {
        const rect = bin.getBoundingClientRect();
        if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
          bin.classList.add('scale-105', 'ring-4', 'ring-white');
        } else {
          bin.classList.remove('scale-105', 'ring-4', 'ring-white');
        }
      });
    }

    function clearBinHighlights() {
      document.querySelectorAll('.bin-zone').forEach((bin) => {
        bin.classList.remove('scale-105', 'ring-4', 'ring-white');
      });
    }

    function checkBinDrop(x, y) {
      const droppedBin = getDroppedBin(x, y);
      if (!droppedBin) return false;

      if (droppedBin === 'recycle') {
        showBadgeModal();
      } else if (droppedBin === 'general') {
        showElfFeedback('咦？我們已經把殘留物清除，而且也沖洗乾淨了！現在它是乾淨的「資源回收物」，不是一般垃圾喔！');
      } else if (droppedBin === 'food') {
        showElfFeedback('廚餘桶只能放吃剩的食物喔！塑膠杯和紙餐盒洗乾淨後，應該要放進「資源回收桶」才對！');
      }
      return true;
    }

    function triggerMissingStepFeedback() {
      const isDrink = activeTarget === 'drink';
      if (isDrink) {
        if (currentStep === 1) {
          showElfFeedback('先別急著丟！杯口上還黏著塑膠封膜，請先左右滑動把封膜撕下來！');
        } else if (currentStep === 2) {
          showElfFeedback('塑膠吸管還插在杯子上呢！請先點擊把吸管拔出來，才能分開回收喔！');
        } else if (currentStep === 3) {
          showElfFeedback('杯底還有殘留的飲料茶漬，直接回收會發臭長蟲！請先左右搖晃手機（或來回滑動）沖洗乾淨喔！');
        }
      } else {
        if (currentStep === 1) {
          showElfFeedback('便當盒裡還有剩飯和菜渣！請先按住飯菜拖曳進「🍲 廚餘回收」桶，避免污染回收物！');
        } else if (currentStep === 2) {
          showElfFeedback('便當盒還油膩膩的！請先左右搖晃手機（或來回滑動）模擬沖洗油漬，再放進資源回收桶喔！');
        }
      }
    }

    // =========================================================================
    // 搖晃手機沖洗 + 水花特效
    // =========================================================================
    function handleDeviceMotion(event) {
      if (!activeTarget) return;
      const isRinseStep = (activeTarget === 'drink' && currentStep === 3) || (activeTarget === 'bento' && currentStep === 2);
      if (!isRinseStep) return;

      const acc = event.acceleration && event.acceleration.x !== null
        ? event.acceleration
        : event.accelerationIncludingGravity;
      if (!acc) return;

      const lateralForce = Math.abs(acc.x || 0);
      if (lateralForce > 8.5) {
        triggerRinseProgress(10);
      }
    }

    function triggerRinseProgress(amount) {
      const isDrink = activeTarget === 'drink';
      const expectedStep = isDrink ? 3 : 2;
      if (currentStep !== expectedStep) return;

      rinseAmount = Math.min(100, rinseAmount + amount);
      document.getElementById('rinse-progress-bar').style.width = `${rinseAmount}%`;

      const modelEl = isDrink ? modelDrinkEl : modelBentoEl;
      if (modelEl.object3D) {
        modelEl.object3D.rotation.z = (Math.random() - 0.5) * 0.45;
        spawnWaterSplash(modelEl.object3D);
      }

      if (rinseAmount >= 100) {
        if (modelEl.object3D) modelEl.object3D.rotation.z = 0;
        currentStep = expectedStep + 1;
        updateStepUI();
      }
    }

    function spawnWaterSplash(parentObj) {
      const THREE = AFRAME.THREE;
      const dropGeo = new THREE.SphereGeometry(0.008, 8, 8);
      const dropMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });

      for (let i = 0; i < 6; i++) {
        const drop = new THREE.Mesh(dropGeo, dropMat);
        drop.position.set(
          (Math.random() - 0.5) * 0.14,
          0.1 + Math.random() * 0.08,
          (Math.random() - 0.5) * 0.14
        );
        let vy = 0.014 + Math.random() * 0.012;
        parentObj.add(drop);

        const anim = setInterval(() => {
          drop.position.y += vy;
          vy -= 0.003;
          if (drop.position.y < -0.05) {
            clearInterval(anim);
            parentObj.remove(drop);
          }
        }, 25);
      }
    }

    function animateRemovePart(obj, targetOffset, onComplete) {
      if (!obj) {
        if (onComplete) onComplete();
        return;
      }
      let progress = 0;
      const startPos = obj.position.clone();
      const timer = setInterval(() => {
        progress += 0.08;
        obj.position.x = startPos.x + targetOffset.x * progress;
        obj.position.y = startPos.y + targetOffset.y * progress;
        obj.rotation.z += 0.15;
        if (progress >= 1) {
          clearInterval(timer);
          obj.visible = false;
          if (onComplete) onComplete();
        }
      }, 16);
    }

    function showElfFeedback(msg) {
      document.getElementById('elf-message').textContent = msg;
      document.getElementById('elf-feedback').classList.remove('hidden');
    }

    function hideElfFeedback() {
      document.getElementById('elf-feedback').classList.add('hidden');
    }

    function showBadgeModal() {
      const isDrink = activeTarget === 'drink';
      document.getElementById('badge-summary').textContent = isDrink
        ? '你成功辨識飲料杯圖卡，手動完成拆封膜、拔吸管、沖洗並投入資源回收桶！'
        : '你成功辨識便當盒圖卡，手動完成清廚餘、沖洗油漬並投入資源回收桶！';
      document.getElementById('badge-modal').classList.remove('hidden');
    }

    function scanAnotherCard() {
      resetToScanMode();
    }

    function resetCurrentTask() {
      document.getElementById('badge-modal').classList.add('hidden');
      resetStepState(true);
      if (isTargetVisible && activeTarget) {
        attachModelToPhoto(activeTarget);
      }
    }

    window.addEventListener('pagehide', () => {
      try {
        sceneEl.systems['mindar-image-system']?.stop();
      } catch (e) {}
    });
  </script>
</body>
</html>
